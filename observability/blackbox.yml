modules:
  http_2xx:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      # Fly machines scale to zero, so a probe can legitimately pay a cold start.
      # A tight timeout here manufactures downtime that users never experienced.
      fail_if_not_ssl: false
