global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: surveyhub
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: surveyhub-api
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8000]
        labels:
          service: api
    # Cold starts and long Gemini calls can stall a scrape; failing the target on a
    # 10s timeout produces phantom gaps in the SLO numerator.
    scrape_timeout: 10s

  # The frontend is nginx serving a static export — it has no Prometheus endpoint, and
  # scraping its JSON /healthz just yields "unsupported Content-Type". Availability of
  # the static site is covered by the blackbox `uptime` job below, which is the right
  # way to measure a CDN-served asset anyway: from outside, as a user sees it.

  # Blackbox-style external check. In production this points at the real Fly URL so
  # the SLO is measured from outside the platform rather than from inside it — an API
  # that reports itself healthy while the edge is down is the failure mode that matters.
  - job_name: uptime
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://surveyhub-api.fly.dev/healthz
          - https://surveyhub-aha.pages.dev
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
