# Local observability stack. Compose it alongside the app:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana  http://localhost:3001  (anonymous, auto-provisioned dashboard)
# Prometheus http://localhost:9090
#
# Kept in a separate file so the application stack stays lightweight for people who
# just want to run the app.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    healthcheck:
      # --proxy=off matters: some Docker daemons inject HTTP_PROXY into every container,
      # and busybox wget ignores NO_PROXY, so a loopback probe gets routed to the
      # corporate proxy and comes back 503. The container is fine; the check was lying.
      test: ["CMD", "wget", "--proxy=off", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local only. Production Grafana sits behind real auth.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --proxy=off -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"

volumes:
  prometheus_data:
  grafana_data:
