# Serves the Next.js static export. Mirrors public/_redirects and public/_headers so
# the container and Cloudflare Pages behave identically.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Cloudflare terminates TLS upstream; keep the original scheme for redirects.
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Liveness target for the container healthcheck and for uptime probing.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed build assets are immutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML must revalidate or clients pin to a stale bundle after deploy.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # Static export writes /route.html; dynamic routes fall back to the SPA shell,
        # matching the _redirects rules used on Pages.
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    error_page 404 /404.html;
}
